<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Отметка присутствия</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e5ea;
  --accent:#2f6df6; --accent-ink:#fff; --ok:#15803d; --ok-bg:#e7f6ec;
  --bad:#b42318; --bad-bg:#fdeceb; --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101216; --card:#191c22; --ink:#eceef2; --muted:#99a0ad; --line:#2a2e37;
    --accent:#5b8dff; --accent-ink:#0b1020; --ok:#6ee7a0; --ok-bg:#10261a;
    --bad:#ff9b93; --bad-bg:#2b1513;
  }
}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:.9rem}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,textarea,select,button{font:inherit;width:100%;border-radius:10px}
input,textarea,select{padding:13px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:120px;resize:vertical}
/* всё крупное: страницу открывают с телефона, одной рукой */
button{min-height:52px;padding:14px 16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;cursor:pointer}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{color:var(--bad);border:1px solid var(--bad);background:transparent}
button[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px}
.row>*{flex:1}
.row button{padding:14px 8px;font-size:.95rem}
.code{font:700 clamp(48px,18vw,84px)/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.12em;text-align:center;margin:6px 0 2px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.pin{font:700 1.6rem/1 ui-monospace,Menlo,monospace;letter-spacing:.5em;text-align:center;padding-left:.5em}
.msg{padding:13px 14px;border-radius:10px;margin:12px 0 0;font-weight:600}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
ul.people{list-style:none;margin:0;padding:0}
ul.people li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
ul.people li:last-child{border-bottom:0}
ul.people .when{color:var(--muted);font-size:.82rem;white-space:nowrap}
ul.people button{width:auto;min-height:36px;padding:6px 12px;font-size:.82rem}
/* строка сохранённой отметки: широкая кнопка + узкая «Удалить» */
ul.people button.grow{flex:1;min-width:0;width:100%;min-height:46px;text-align:left;font-size:.9rem;padding:8px 12px}
.namelist{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.namelist button{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-bottom:8px}
.namelist button.gone{opacity:.45;text-decoration:line-through}
.link{word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:.8rem;margin:0 6px 6px 0}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* Ключ anon и должен быть публичным — держать его в этом файле безопасно.
   Данные защищают правила внутри базы, а не скрытность ключа. */
const SUPABASE_URL = "https://dnfrdlcxqwagwnqglxcz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGci••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••";

/* Сколько живёт код на экране, в секундах. Должно совпадать со значением
   в SQL-функциях check_in и admin_view. */
const CODE_PERIOD = 180;

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Идентификатор браузера. Именно он даёт правило «одна отметка с телефона».
   Тот, кто очистит хранилище, получит новый — это известное слабое место,
   поэтому основную нагрузку несёт меняющийся код. */
function deviceId() {
  try {
    let d = localStorage.getItem("attendance.device");
    if (!d) {
      d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
      localStorage.setItem("attendance.device", d);
    }
    return d;
  } catch { return ""; }
}

async function rpc(fn, args) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(args)
  });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && (data.message || data.hint)) || "Не удалось связаться с базой.");
  return data || {};
}

/* Сохранённые ссылки администратора. Живут только в этом браузере —
   на другом устройстве список будет пустым. */
const readSaved = () => { try { return JSON.parse(localStorage.getItem("attendance.sessions")) || []; } catch { return []; } };
const writeSaved = list => { try { localStorage.setItem("attendance.sessions", JSON.stringify(list.slice(0, 20))); } catch {} };
const save = entry => writeSaved([entry].concat(readSaved().filter(s => s.id !== entry.id)));
const forget = id => writeSaved(readSaved().filter(s => s.id !== id));

/* ── адреса: #/j/<id> — для одногруппников, #/a/<id>/<key> — для вас ── */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "j" && parts[1]) return { view: "checkin", id: parts[1] };
  if (parts[0] === "a" && parts[1] && parts[2]) return { view: "admin", id: parts[1], key: parts[2] };
  return { view: "create" };
}

let timers = [];
const stopTimers = () => { timers.forEach(clearInterval); timers = []; };

function render() {
  stopTimers();
  const r = route();
  if (r.view === "checkin") return viewCheckin(r.id);
  if (r.view === "admin") return viewAdmin(r.id, r.key);
  viewCreate();
}

/* Удаление отметки: сначала из базы, потом из локального списка.
   Если в базе её уже нет — всё равно убираем из списка, чтобы не залипала. */
async function deleteSession(s) {
  try { await rpc("delete_session", { p_session: s.id, p_key: s.key }); } catch {}
  forget(s.id);
}

/* ── создание отметки ───────────────────────────────────────────────── */
function viewCreate() {
  const saved = readSaved();
  app.innerHTML = `
  <div class="card">
    <h1>Новая отметка присутствия</h1>
    <p class="muted">Займёт десять секунд. Вы получите ссылку для чата и код для экрана.</p>
    <form id="f" autocomplete="off">
      <label for="title">Что отмечаем?</label>
      <input id="title" type="text" placeholder="Математика, понедельник 9:00" required>

      <label for="roster">Список группы <span class="muted">(по одному имени в строке — необязательно)</span></label>
      <textarea id="roster" placeholder="Алексей Иванов&#10;Мария Петрова&#10;Дмитрий Волков"></textarea>
      <p class="muted">Со списком каждый нажимает своё имя и придумать новое невозможно.
         Оставьте поле пустым, чтобы имена вводили вручную.</p>

      <label style="display:flex;gap:10px;align-items:center;margin-top:16px">
        <input id="needcode" type="checkbox" checked style="width:22px;height:22px;flex:0 0 auto">
        <span>Требовать код, который меняется у меня на экране</span>
      </label>

      <button type="submit" style="margin-top:18px">Создать</button>
      <div id="msg" class="msg bad" hidden></div>
    </form>
  </div>
  ${saved.length ? `
  <div class="card">
    <h2>Ваши прошлые отметки</h2>
    <ul class="people">${saved.map(s => `
      <li>
        <button class="secondary grow" data-go="#/a/${esc(s.id)}/${esc(s.key)}">${esc(s.title)}<br>
          <span class="when">${esc(new Date(s.at).toLocaleString("ru-RU"))}</span></button>
        <button class="danger" data-del="${esc(s.id)}">Удалить</button>
      </li>`).join("")}</ul>
    <p class="muted" style="margin-top:14px">«Удалить» стирает отметку и всех отметившихся
       из базы навсегда, а её ссылка перестаёт работать.</p>
    <button class="secondary" id="forget">Очистить список на этом устройстве</button>
  </div>` : ""}`;

  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });

  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const s = readSaved().find(x => x.id === b.dataset.del);
    if (!s) return;
    if (!confirm("Удалить отметку «" + s.title + "» вместе со списком отметившихся? Отменить будет нельзя.")) return;
    b.disabled = true;
    await deleteSession(s);
    viewCreate();
  });

  const forgetBtn = app.querySelector("#forget");
  if (forgetBtn) forgetBtn.onclick = () => {
    if (!confirm("Убрать список ссылок с этого устройства? Сами отметки и данные останутся в базе, но вернуться к ним вы сможете только по сохранённой ссылке.")) return;
    writeSaved([]);
    viewCreate();
  };

  app.querySelector("#f").onsubmit = async e => {
    e.preventDefault();
    const title = app.querySelector("#title").value.trim();
    const seen = new Set(), roster = [];
    for (const line of app.querySelector("#roster").value.split("\n")) {
      const name = line.trim().replace(/\s+/g, " ").slice(0, 60);
      // ё и е — одна буква, как и в базе
      const key = name.toLowerCase().replace(/ё/g, "е").replace(/[^a-z0-9\u0400-\u04ff]+/g, "");
      if (name && key && !seen.has(key)) { seen.add(key); roster.push(name); }
    }
    const msg = app.querySelector("#msg");
    try {
      const out = await rpc("create_session", {
        p_title: title, p_roster: roster, p_require_code: app.querySelector("#needcode").checked
      });
      if (out.error) throw new Error(out.error);
      save({ id: out.id, key: out.admin_key, title: title || "Присутствие", at: Date.now() });
      location.hash = "#/a/" + out.id + "/" + out.admin_key;
    } catch (err) {
      msg.textContent = err.message;
      msg.hidden = false;
    }
  };
}

/* ── ваша панель ────────────────────────────────────────────────────── */
function viewAdmin(id, key) {
  app.innerHTML = `
  <div class="card">
    <h1 id="t">Загрузка…</h1>
    <p class="muted" id="count"></p>
    <div class="row">
      <button class="secondary" id="toggle">Закрыть</button>
      <button class="secondary" id="csv">Скачать CSV</button>
    </div>
  </div>
  <div class="card" id="codeCard" hidden>
    <h2>Покажите этот код аудитории</h2>
    <div class="code" id="code">••••</div>
    <div class="bar"><i id="bar" style="width:100%"></i></div>
    <p class="muted" style="margin-top:10px">Код меняется каждые 3 минуты. Тот, кого нет
       в аудитории, отметиться не сможет, даже если у него есть ссылка.</p>
  </div>
  <div class="card">
    <h2>Ссылка для чата</h2>
    <div class="link" id="link"></div>
    <button class="secondary" id="copy">Скопировать ссылку</button>
  </div>
  <div class="card"><h2 id="ph">Отметились</h2><ul class="people" id="list"></ul></div>
  <div class="card" id="missCard" hidden><h2>Ещё не отметились</h2><div id="miss"></div></div>
  <div class="card">
    <p class="muted">Не показывайте адрес этой страницы: это единственный вход в вашу
       отметку, и любой, у кого он есть, сможет менять список.</p>
    <button class="secondary" id="new" style="margin-bottom:10px">Создать новую отметку</button>
    <button class="danger" id="del">Удалить эту отметку</button>
  </div>`;

  const $ = s => app.querySelector(s);
  const joinLink = location.origin + location.pathname + "#/j/" + id;
  $("#link").textContent = joinLink;
  $("#new").onclick = () => { location.hash = ""; };
  $("#csv").onclick = () => exportCsv(id, key);
  $("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(joinLink); $("#copy").textContent = "Скопировано"; }
    catch { $("#copy").textContent = "Выделите ссылку выше и скопируйте"; }
    setTimeout(() => ($("#copy").textContent = "Скопировать ссылку"), 1800);
  };

  let left = CODE_PERIOD, open = true, title = "";

  $("#del").onclick = async () => {
    if (!confirm("Удалить отметку «" + (title || "без названия") + "» вместе со списком отметившихся? Отменить будет нельзя.")) return;
    $("#del").disabled = true;
    stopTimers();
    await deleteSession({ id, key });
    location.hash = "";
    render();
  };

  async function refresh() {
    let d;
    try { d = await rpc("admin_view", { p_session: id, p_key: key }); }
    catch { return; }
    if (d.error) { stopTimers(); $("#t").textContent = d.error; return; }

    open = d.is_open;
    title = d.title;
    const n = d.attendees.length;
    $("#t").textContent = d.title;
    $("#count").textContent =
      (d.roster_size ? "Отметились: " + n + " из " + d.roster_size : "Отметились: " + n)
      + (open ? "" : " · закрыто");
    $("#ph").textContent = "Отметились (" + n + ")";
    $("#toggle").textContent = open ? "Закрыть" : "Открыть снова";
    $("#codeCard").hidden = !d.require_code || !open;
    $("#code").textContent = d.code;
    left = d.seconds_left;

    $("#list").innerHTML = n
      ? d.attendees.map(a => `<li><span>${esc(a.name)}</span>
          <span style="display:flex;gap:10px;align-items:center">
            <span class="when">${esc(new Date(a.at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }))}</span>
            <button class="secondary" data-rm="${esc(a.name)}">Убрать</button>
          </span></li>`).join("")
      : `<li class="muted">Пока никого.</li>`;

    $("#list").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
      if (!confirm("Убрать из списка: " + b.dataset.rm + "?")) return;
      await rpc("remove_attendee", { p_session: id, p_key: key, p_name: b.dataset.rm });
      refresh();
    });

    $("#missCard").hidden = !d.missing.length;
    $("#miss").innerHTML = d.missing.map(m => `<span class="tag">${esc(m)}</span>`).join("");
  }

  $("#toggle").onclick = async () => {
    await rpc("set_open", { p_session: id, p_key: key, p_open: !open });
    refresh();
  };

  refresh();
  timers.push(setInterval(refresh, 3000));
  timers.push(setInterval(() => {
    left = Math.max(0, left - 1);
    const bar = $("#bar");
    if (bar) bar.style.width = (left / CODE_PERIOD * 100) + "%";
  }, 1000));
}

async function exportCsv(id, key) {
  const d = await rpc("admin_view", { p_session: id, p_key: key });
  if (d.error) return alert(d.error);
  const rows = [["Имя", "Время отметки"]].concat(
    d.attendees.map(a => [a.name, new Date(a.at).toLocaleString("ru-RU")]));
  const csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "prisutstvie-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ── что открывает одногруппник ─────────────────────────────────────── */
async function viewCheckin(id) {
  app.innerHTML = `<div class="card"><h1 id="t">Загрузка…</h1><p class="muted" id="s">Секунду.</p></div>`;
  const $ = s => app.querySelector(s);
  const device = deviceId();

  let state;
  try { state = await rpc("public_session", { p_session: id, p_device: device }); }
  catch { $("#t").textContent = "Нет связи"; $("#s").textContent = "Проверьте интернет и обновите страницу."; return; }

  if (state.error) { $("#t").textContent = "Ссылка не работает"; $("#s").textContent = state.error; return; }

  const done = name => {
    app.innerHTML = `<div class="card"><h1>Вы отмечены</h1>
      <p class="muted">Записано как <strong>${esc(name)}</strong>.</p></div>`;
  };
  if (state.already) return done(state.already);

  $("#t").textContent = state.title;
  if (!state.is_open) { $("#s").textContent = "Отметка закрыта."; return; }

  const hasRoster = state.roster.length > 0;
  $("#s").textContent = hasRoster
    ? "Нажмите своё имя, введите код с экрана и подтвердите."
    : "Введите своё имя и код с экрана.";

  app.insertAdjacentHTML("beforeend", `
  <form class="card" id="f" autocomplete="off">
    ${hasRoster ? `
      <label for="filter">Найдите своё имя</label>
      <input id="filter" type="search" placeholder="Начните вводить…">
      <div class="namelist" id="names"></div>` : `
      <label for="free">Имя и фамилия</label>
      <input id="free" type="text" autocomplete="name" placeholder="например, Алексей Иванов">`}
    ${state.require_code ? `
      <label for="code">Код с экрана</label>
      <input id="code" class="pin" type="text" inputmode="numeric" pattern="[0-9]*"
             maxlength="4" placeholder="0000" autocomplete="one-time-code">
      <p class="muted">Он меняется каждые 3 минуты — прочитать его можно только в аудитории.</p>` : ""}
    <button id="go" type="submit">Я здесь</button>
    <div id="msg" class="msg bad" hidden></div>
  </form>`);

  let picked = null;
  const taken = new Set(state.taken.map(n => n.toLowerCase()));

  function drawNames() {
    const q = $("#filter").value.trim().toLowerCase();
    const hits = state.roster.filter(n => n.toLowerCase().includes(q)).slice(0, 60);
    $("#names").innerHTML = hits.length
      ? hits.map(n => `<button type="button" data-n="${esc(n)}"
          class="${taken.has(n.toLowerCase()) ? "gone" : ""}"
          ${taken.has(n.toLowerCase()) ? "disabled" : ""}
          style="${n === picked ? "border-color:var(--accent)" : ""}">${esc(n)}</button>`).join("")
      : `<p class="muted">Ничего не найдено.</p>`;
    $("#names").querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
      picked = b.dataset.n;
      drawNames();
      if ($("#code")) $("#code").focus();
    });
  }
  if (hasRoster) { $("#filter").oninput = drawNames; drawNames(); }

  const say = t => { const m = $("#msg"); m.textContent = t; m.hidden = false; };

  $("#f").onsubmit = async e => {
    e.preventDefault();
    const name = hasRoster ? picked : $("#free").value.trim();
    if (!name) return say("Сначала выберите своё имя.");
    const code = $("#code") ? $("#code").value.trim() : "";
    if (state.require_code && code.length !== 4) return say("Введите код из 4 цифр с экрана.");

    $("#go").disabled = true;
    $("#msg").hidden = true;
    try {
      const out = await rpc("check_in", { p_session: id, p_name: name, p_code: code, p_device: device });
      if (out.ok) return done(out.name);
      say(out.error || "Что-то пошло не так. Попробуйте ещё раз.");
      // Зачёркиваем имя только если оно действительно занято;
      // при неверном коде выбор должен остаться.
      if (hasRoster && /уже в списке/.test(out.error || "")) {
        taken.add(name.toLowerCase());
        picked = null;
        drawNames();
      }
    } catch {
      say("Нет связи. Попробуйте ещё раз.");
    } finally {
      $("#go").disabled = false;
    }
  };
}

window.addEventListener("hashchange", render);
render();
</script>
