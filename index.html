<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Roll Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1C2333; --ink-soft:#2A3247; --paper:#F7F3EA; --paper-dim:#EDE7D8;
    --text:#232323; --text-dim:#6b6558; --stamp:#B33F3F; --line:#d9d2bf;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  html,body{margin:0;padding:0;background:var(--ink);}
  body{font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px;}
  .sheet{width:100%;max-width:560px;background:var(--paper);min-height:100vh;box-shadow:0 0 60px rgba(0,0,0,0.35);position:relative;}
  header{padding:clamp(20px,5vw,32px) clamp(20px,5vw,32px) 18px;border-bottom:2px solid var(--ink);}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(28px,7vw,38px);margin:0 0 10px;letter-spacing:-0.01em;}
  .meta-row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  #sessionName{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim);}
  #countBadge{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;background:var(--ink);color:var(--paper);padding:4px 10px;border-radius:20px;}
  .banner{margin:16px clamp(20px,5vw,32px) 0;padding:12px 16px;border:1.5px dashed var(--stamp);border-radius:10px;font-size:14px;color:var(--stamp);display:none;font-weight:500;}
  .banner.show{display:block;}
  main{padding:10px clamp(20px,5vw,32px) 40px;}
  .empty,.loading{text-align:center;color:var(--text-dim);padding:60px 20px;font-size:14px;}
  .loading{font-family:'JetBrains Mono',monospace;font-size:13px;}
  ul.roster{list-style:none;margin:16px 0 0;padding:0;}
  li.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;transition:background 0.15s ease;}
  li.row:active{background:var(--paper-dim);}
  li.row.disabled{cursor:default;}
  li.row:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);width:22px;flex-shrink:0;}
  .name{font-family:'Fraunces',serif;font-size:18px;font-weight:500;flex:1;min-width:0;}
  .status{flex-shrink:0;text-align:right;min-width:90px;}
  .status .stamp-mark{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.05em;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;padding:3px 7px;transform:rotate(-6deg);text-transform:uppercase;animation:stampIn 0.25s ease-out;}
  @keyframes stampIn{0%{transform:rotate(-6deg) scale(1.8);opacity:0;}100%{transform:rotate(-6deg) scale(1);opacity:1;}}
  .status .time{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:3px;}
  .status .blank{display:inline-block;width:60px;border-bottom:1.5px solid var(--line);}
  .overlay{position:fixed;inset:0;background:rgba(20,20,20,0.55);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  @media (min-width:560px){.overlay{align-items:center;}}
  .modal{background:var(--paper);width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:26px 22px 30px;box-shadow:0 -8px 40px rgba(0,0,0,0.3);}
  @media (min-width:560px){.modal{border-radius:16px;}}
  .modal h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 8px;}
  .modal p{font-size:14px;color:var(--text-dim);margin:0 0 20px;line-height:1.5;}
  .modal-btns{display:flex;gap:10px;}
  button.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:15px;padding:13px 18px;border-radius:10px;border:none;cursor:pointer;flex:1;-webkit-tap-highlight-color:transparent;}
  button.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-secondary{background:transparent;color:var(--text);border:1.5px solid var(--line);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:20px;font-size:13px;z-index:80;opacity:0;transition:opacity 0.25s ease;pointer-events:none;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="sheet">
  <header>
    <p class="eyebrow" id="dateLabel">—</p>
    <h1>Roll Call</h1>
    <div class="meta-row">
      <span id="sessionName">loading session…</span>
      <span id="countBadge">0/0</span>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <main>
    <div id="loadingState" class="loading">Opening the ledger…</div>
    <ul class="roster" id="rosterList" style="display:none;"></ul>
    <div class="empty" id="emptyState" style="display:none;">No active session right now. Check back once your teacher starts one.</div>
  </main>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h2>Stamp your attendance?</h2>
    <p id="confirmBody"></p>
    <div class="modal-btns">
      <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary" id="confirmYes">Yes, that's me</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== FILL THESE IN AFTER YOU CREATE YOUR SUPABASE PROJECT ======
// Project Settings -> API -> Project URL / anon public key
const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
// ====================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;
let attendance = {}; // name -> marked_at
let deviceToken = localStorage.getItem('rollcall_device_token');
if(!deviceToken){
  deviceToken = crypto.randomUUID();
  localStorage.setItem('rollcall_device_token', deviceToken);
}
let myMarkedName = null;
let pendingName = null;

const $ = (id) => document.getElementById(id);

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function fmtTime(iso){
  try{ return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return ''; }
}

async function loadSession(){
  const { data, error } = await sb
    .from('class_sessions')
    .select('*')
    .eq('is_current', true)
    .order('created_at', {ascending:false})
    .limit(1)
    .maybeSingle();

  if(error || !data){
    $('loadingState').style.display = 'none';
    $('emptyState').style.display = 'block';
    return;
  }
  session = data;
  await loadAttendance();
  subscribeRealtime();
  render();
}

async function loadAttendance(){
  const { data, error } = await sb
    .from('attendance')
    .select('name, marked_at, device_token')
    .eq('session_id', session.id);
  attendance = {};
  if(!error && data){
    data.forEach(row => { attendance[row.name] = row.marked_at; });
    const mine = data.find(row => row.device_token === deviceToken);
    myMarkedName = mine ? mine.name : null;
  }
}

function subscribeRealtime(){
  sb.channel('attendance-' + session.id)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'attendance', filter: `session_id=eq.${session.id}` },
      (payload) => {
        attendance[payload.new.name] = payload.new.marked_at;
        if(payload.new.device_token === deviceToken) myMarkedName = payload.new.name;
        render();
      })
    .subscribe();
}

function render(){
  $('loadingState').style.display = 'none';
  $('emptyState').style.display = 'none';
  $('dateLabel').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'});
  $('sessionName').textContent = session.name;
  $('countBadge').textContent = Object.keys(attendance).length + '/' + session.roster.length;

  const banner = $('banner');
  if(myMarkedName){
    banner.textContent = "You're checked in as " + myMarkedName + ". Thanks!";
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }

  const list = $('rosterList');
  list.style.display = 'block';
  list.innerHTML = '';
  session.roster.forEach((name, i) => {
    const li = document.createElement('li');
    li.className = 'row' + (myMarkedName ? ' disabled' : '');
    li.tabIndex = 0;
    li.setAttribute('role', 'button');

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i+1).padStart(2,'0');

    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = name;

    const status = document.createElement('span');
    status.className = 'status';
    if(attendance[name]){
      status.innerHTML = '<span class="stamp-mark">Present</span><span class="time">'+fmtTime(attendance[name])+'</span>';
    } else {
      status.innerHTML = '<span class="blank">&nbsp;</span>';
    }

    li.appendChild(num); li.appendChild(nm); li.appendChild(status);

    if(!myMarkedName && !attendance[name]){
      li.addEventListener('click', () => openConfirm(name));
      li.addEventListener('keydown', (e) => { if(e.key==='Enter'||e.key===' ') openConfirm(name); });
    }
    list.appendChild(li);
  });
}

function openConfirm(name){
  pendingName = name;
  $('confirmBody').textContent = 'Confirm this is you: "' + name + '". You can only stamp one name per device.';
  $('confirmOverlay').classList.add('show');
}
$('confirmCancel').addEventListener('click', () => {
  $('confirmOverlay').classList.remove('show');
  pendingName = null;
});
$('confirmYes').addEventListener('click', async () => {
  $('confirmOverlay').classList.remove('show');
  if(!pendingName) return;
  await markPresent(pendingName);
  pendingName = null;
});

async function markPresent(name){
  const { data, error } = await sb.rpc('mark_attendance', {
    p_session_id: session.id,
    p_name: name,
    p_device_token: deviceToken
  });

  if(error){
    toast("Couldn't reach the server — check your connection and try again.");
    return;
  }
  if(data === 'ok'){
    attendance[name] = new Date().toISOString();
    myMarkedName = name;
    toast("Stamped in as " + name + "!");
  } else if(data === 'device_already_marked'){
    toast("This device already stamped in.");
    await loadAttendance();
  } else if(data === 'name_already_marked'){
    toast(name + " is already marked present.");
    await loadAttendance();
  } else {
    toast("That name isn't on the roster.");
  }
  render();
}

loadSession();
</script>

</body>
</html>
